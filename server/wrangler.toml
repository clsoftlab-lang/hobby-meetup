#
# Cloudflare Workers config for the 같이해요 AI proxy (server/worker.js).
# Free tier = no server to babysit (무인). The API key is a Worker SECRET,
# never committed here:
#   wrangler secret put ANTHROPIC_API_KEY
#
# Optional non-secret overrides can be set as vars below or via the dashboard.

name = "gatchihaeyo-ai-proxy"
main = "worker.js"
compatibility_date = "2024-11-01"

[vars]
# Cost-first default. Raise to "claude-sonnet-5" or "claude-opus-5" for higher quality.
AI_MODEL = "claude-haiku-4-5"
# Modest output cap; raise only where a task truly needs it.
AI_MAX_TOKENS = "700"
# Effort for non-Haiku models only (Haiku 4.5 ignores thinking/effort).
AI_EFFORT = "low"

# ANTHROPIC_API_KEY is NOT set here — it is a secret:
#   wrangler secret put ANTHROPIC_API_KEY
